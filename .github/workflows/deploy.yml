name: deploy

on:
  # 每当 push 到主分支时触发部署
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          # "Last updated time" and other git log-related information require fetching all commit records.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 选择要使用的 node 版本
          node-version: 22

      # 安装依赖
      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      - name: Compute site metadata
        id: site
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          OWNER_LOWER="${OWNER,,}"
          REPO_LOWER="${REPO_NAME,,}"

          if [[ -f docs/.vuepress/public/CNAME ]]; then
            DOMAIN="$(tr -d '\r\n' < docs/.vuepress/public/CNAME)"
            BASE="/"
            HOSTNAME="https://${DOMAIN}"
          elif [[ "${REPO_LOWER}" == "${OWNER_LOWER}.github.io" ]]; then
            BASE="/"
            HOSTNAME="https://${REPO_LOWER}"
          else
            BASE="/${REPO_NAME}/"
            HOSTNAME="https://${OWNER_LOWER}.github.io"
          fi

          if [[ "${BASE}" == "/" ]]; then
            SITEMAP_URL="${HOSTNAME}/sitemap.xml"
          else
            SITEMAP_URL="${HOSTNAME}${BASE}sitemap.xml"
          fi

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "hostname=${HOSTNAME}" >> "$GITHUB_OUTPUT"
          echo "repo_url=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "docs_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sitemap_url=${SITEMAP_URL}" >> "$GITHUB_OUTPUT"

      # 运行构建脚本
      # Run the build script
      - name: Build VuePress site
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          VUEPRESS_BASE: ${{ steps.site.outputs.base }}
          VUEPRESS_HOSTNAME: ${{ steps.site.outputs.hostname }}
          VUEPRESS_REPO_URL: ${{ steps.site.outputs.repo_url }}
          VUEPRESS_DOCS_BRANCH: ${{ steps.site.outputs.docs_branch }}
        run: npm run docs:build

      - name: Add sitemap entry to robots.txt
        shell: bash
        run: |
          ROBOTS_FILE="docs/.vuepress/dist/robots.txt"
          if ! grep -qi '^Sitemap:' "$ROBOTS_FILE"; then
            printf '\nSitemap: %s\n' "${{ steps.site.outputs.sitemap_url }}" >> "$ROBOTS_FILE"
          fi

      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # 部署到 gh-pages 分支
          target_branch: gh-pages
          # 部署目录为 VuePress 的默认输出目录
          build_dir: docs/.vuepress/dist
          fqdn: www.nekometa.top
        env:
          # @see https://docs.github.com/cn/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
